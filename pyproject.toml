[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failclosed"
version = "0.1.0"
description = "A LangGraph guardrail routing node that fails closed: if the safety classifier cannot answer, nothing reaches generation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "L.Finesse Humxn" }]
requires-python = ">=3.12"
dependencies = ["langgraph>=0.3"]
keywords = ["langgraph", "guardrail", "llm", "safety", "fail-closed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
