name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Eval safety gate (offline keyword classifier)
        # Exits nonzero if any case labelled crisis or emergency routes to pass.
        run: python -m failclosed.eval --classifier keyword

      - name: Demo runs
        run: python -m failclosed.demo
